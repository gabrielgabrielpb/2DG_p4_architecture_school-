<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Plano del baño de chicos</title>
    <style>
        body { margin: 0; padding: 40px; background: #eee; }

            .baño {              /* POR DEFECTO VA EN FILA(PUEDE SER ROW O COLUMN) */
                display: flex;
                flex-direction: row;  /* aqui se ve pa que quede claro, si no estuviese esta linea tendria el mismo efecto) */
                align-items: flex-end;  /* hace que los dos cuartos se alineen por abajo */
            }

                .cuarto-pequeño {
                    width: 220px;
                    height: 330px;
                    border: 6px solid #333;
                    border-right: none;          
                    background: #fff;
                    position: relative; /*  */
                    box-sizing: border-box;
                }

                    .taza {                         /* CIRCULO DEL VATER */
                        width: 50px;
                        height: 50px;
                        border: 2px solid #333;
                        border-radius: 50%;
                        position: absolute; /* USAR ABSOLUTE OARA CUADNO LOS ELEMENTOS QUERAMOS QUE ESTEN EN UN PUNTO CONCRETO COMO LAS PARTES DEL VATER */
                        left: 85px;
                        bottom: 62px;
                    }

                    .cisterna {                     /* RECTANGULO DEL VATER */
                        width: 70px;
                        height: 25px;
                        border: 2px solid #333;
                        position: absolute;
                        left: 75px;
                        bottom: 35px;
                    }

                .cuarto-grande {
                    width: 380px;
                    height: 900px;
                    border: 6px solid #333;
                    background: #fff;
                    box-sizing: border-box;
                    display: flex;
                    flex-direction: column;       /* hace que los elementos se apilen de arriba a abajo (en columna) AQUI NO USAMOS EL POSITION PORQUE SON VARIOS ELEMENTOS */
                    position: relative;
                    align-items: flex-end;        /*  se pegan a la pared derecha */
                }

                    .lavabos {
                        width: 100px;
                        height: 400px;
                        border-left: 2px solid #333;
                        border-bottom: 2px solid #333;
                        display: flex;
                        flex-direction: column; 
                        justify-content: space-evenly; /* reparte los 3 círculos proporcionalmente en el espacio disponible */
                        align-items: center; /* hace que esten centraos horizontalmente */
                    }
                    .lavamanos {
                        width: 60px;
                        height: 60px;
                        border: 2px solid #333;
                        border-radius: 50%;
                    }


                    .pilar {
                        width: 100px;
                        height: 75px;
                        background: #555;
                    }


                    .bidet {
                        width: 45px;
                        height: 45px;
                        border: 2px solid #333;
                        border-radius: 45px 0 0 45px;
                        margin-top: 60px;             /* separación entre los vateres */
                    }



</style>
</head>


<body>
    <div class="baño">

        <div class="cuarto-pequeño">
            <div class="taza"></div>
            <div class="cisterna"></div>
        </div>

        <div class="cuarto-grande">

            <div class="lavabos">
                <div class="lavamanos"></div>
                <div class="lavamanos"></div>
                <div class="lavamanos"></div>
            </div>

            <div class="pilar"></div>

            <div class="bidet"></div>
            <div class="bidet"></div>
            <div class="bidet"></div>

            <div class="cuarto-secreto">

            </div>
        </div>        
    </div>



    </div>

</body>
</html>
